<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Runner - 무한 횡스크롤 러너 게임</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <!-- 게임 컨테이너 -->
    <div id="gameContainer">
        <!-- 메인 캔버스 -->
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
        
        <!-- UI 오버레이 -->
        <div id="gameUI">
            <!-- 점수 표시 -->
            <div id="scoreBoard">
                <div id="highScore">최고점수: <span>0</span></div>
                <div id="currentScore">점수: <span>0</span></div>
            </div>

            <!-- 더위 게이지 (용암 맵에서만 표시) -->
            <div id="heatGauge" class="heat-gauge">
                <div class="heat-gauge-label">💧 수분</div>
                <div class="heat-gauge-container">
                    <div id="heatGaugeBar" class="heat-gauge-bar"></div>
                    <span id="heatValue" class="heat-gauge-value">100%</span>
                </div>
            </div>
            
            <!-- 게임 상태별 화면 -->
            <div id="menuScreen" class="screen active">
                <h1>Cat Runner</h1>
                <p>스페이스바를 눌러 점프하세요!</p>
                <button id="startBtn">게임 시작</button>
                <button id="settingsBtn">설정</button>
            </div>
            
            <div id="pauseScreen" class="screen">
                <h2>일시정지</h2>
                <button id="resumeBtn">계속하기</button>
                <button id="restartBtn">재시작</button>
                <button id="mainMenuBtn">메인으로</button>
            </div>
            
            <div id="gameOverScreen" class="screen">
                <h2>게임 오버</h2>
                <div id="finalScore">점수: <span>0</span></div>
                <div id="bestScore">최고점수: <span>0</span></div>
                <div id="obstacleCount">통과한 장애물: <span>0</span>개</div>
                <p>스페이스바나 클릭으로 다시 시작</p>
                <button id="backToMenuBtn">메인으로</button>
            </div>
            
            <!-- 설정 화면 -->
            <div id="settingsScreen" class="screen">
                <h2>설정</h2>
                <div class="setting-item">
                    <label>
                        <input type="checkbox" id="soundToggle" checked>
                        사운드
                    </label>
                </div>
                <div class="setting-item">
                    <label>
                        <input type="checkbox" id="sfxToggle" checked>
                        효과음
                    </label>
                </div>
                <button id="closeSettingsBtn">닫기</button>
            </div>
        </div>
        
        <!-- 게임 컨트롤 안내 -->
        <div id="controls">
            <p>스페이스바: 점프 | ESC: 일시정지</p>
        </div>
    </div>

    <!-- JavaScript 모듈 -->
    <script type="module" src="src/js/app.js"></script>
</body>
</html>
