<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Runner - 무한 횡스크롤 러너 게임</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <!-- 게임 컨테이너 -->
    <div id="gameContainer">
        <!-- 메인 캔버스 -->
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
        
        <!-- UI 오버레이 -->
        <div id="gameUI">
            <!-- 점수 표시 -->
            <div id="scoreBoard">
                <div id="currentScore">점수: <span>0</span></div>
            </div>

            <!-- 더위 게이지 (용암 맵에서만 표시) -->
            <div id="heatGauge" class="heat-gauge">
                <div class="heat-gauge-label"><img src="src/assets/images/icons/water.png" alt="수분" class="water-icon"> 수분</div>
                <div class="heat-gauge-container">
                    <div id="heatGaugeBar" class="heat-gauge-bar"></div>
                    <span id="heatValue" class="heat-gauge-value">100%</span>
                </div>
            </div>
            
            <!-- 게임 상태별 화면 -->
            <!-- 스토리 화면 -->
            <div id="storyScreen" class="screen">
                <div id="storyCutscene">
                    <img id="storyCutsceneImage" src="src/assets/images/cut/endcut.png" alt="엔딩 장면">
                </div>
                <div id="storyText"></div>
                <div id="storySkip">클릭 또는 스페이스바로 계속</div>
            </div>

            <div id="menuScreen" class="screen active">
                <h1>Cat Runner</h1>
                <p>스페이스바를 눌러 점프하세요!</p>
                <button id="startBtn">게임 시작</button>
                <button id="settingsBtn">설정</button>
            </div>
            
            <div id="pauseScreen" class="screen">
                <h2>일시정지</h2>
                <button id="resumeBtn">계속하기</button>
                <button id="restartBtn">재시작</button>
                <button id="mainMenuBtn">메인으로</button>
            </div>
            
            <div id="gameOverScreen" class="screen">
                <h2>게임 오버</h2>
                <div id="finalScore">점수: <span>0</span></div>
                <div id="obstacleCount">통과한 장애물: <span>0</span>개</div>
                <button id="backToMenuBtn">메인으로</button>
            </div>
            
            <!-- 설정 화면 -->
            <div id="settingsScreen" class="screen">
                <h2>설정</h2>
                <div class="settings-container">
                    <!-- 왼쪽: 사운드 설정 -->
                    <div class="settings-left">
                        <h3>사운드 설정</h3>
                        <div class="setting-item">
                            <label>
                                <input type="checkbox" id="soundToggle" checked>
                                사운드
                            </label>
                        </div>
                        <div class="setting-item">
                            <label>
                                <input type="checkbox" id="sfxToggle" checked>
                                효과음
                            </label>
                        </div>
                    </div>

                    <!-- 오른쪽: 캐릭터 선택 -->
                    <div class="settings-right">
                        <h3>캐릭터 선택</h3>
                        <div class="character-preview">
                            <img id="characterPreview" src="src/assets/images/player/cat/cat_run_1.png" alt="캐릭터 미리보기">
                        </div>
                        <div class="character-carousel">
                            <button class="carousel-arrow carousel-arrow-left" id="carouselPrev">
                                <span>◀</span>
                            </button>
                            <div class="character-display">
                                <div class="character-display-image">
                                    <img id="carouselImage" src="src/assets/images/player/cat/cat_run_1.png" alt="캐릭터">
                                </div>
                                <div class="character-display-name" id="carouselName">일반 고양이</div>
                            </div>
                            <button class="carousel-arrow carousel-arrow-right" id="carouselNext">
                                <span>▶</span>
                            </button>
                        </div>
                    </div>
                </div>
                <button id="closeSettingsBtn">닫기</button>
            </div>

            <!-- 크레딧 화면 -->
            <div id="creditsScreen" class="screen">
                <h2>플레이해 주셔서 감사합니다!</h2>
                <button id="creditsToMenuBtn">메인으로</button>
            </div>
        </div>
        
        <!-- 게임 컨트롤 안내 -->
        <div id="controls">
            <p>스페이스바: 점프</p>
        </div>
    </div>

    <!-- JavaScript 모듈 -->
    <script type="module" src="src/js/app.js"></script>
</body>
</html>
